<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tessie — Lost Dog Info</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100dvh;
      width: 100%;
      background-color: #050608;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background-color: #111318;
      border: 1px solid #232730;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
    }

    .status {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
      flex-shrink: 0;
    }

    .photo-box {
      width: min(100%, 270px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a2f3a;
      background-color: #0b0d10;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #0c0e12;
      border: 1px solid #222630;
      border-radius: 14px;
      overflow: hidden;
    }

    tr + tr {
      border-top: 1px solid #222630;
    }

    th, td {
      padding: 12px 14px;
      font-size: 0.98rem;
      line-height: 1.3;
    }

    th {
      text-align: left;
      color: #9ca3af;
      font-weight: 500;
    }

    td {
      text-align: right;
      font-weight: 600;
      color: #f9fafb;
    }

    td a {
      color: #60a5fa;
      text-decoration: none;
    }

    .call-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 16px;
      border-radius: 14px;
      background-color: #16a34a;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-height: 680px) {
      .card {
        padding: 14px;
        gap: 12px;
      }
      .photo-box {
        width: min(100%, 210px);
      }
      th, td {
        padding: 10px 12px;
        font-size: 0.92rem;
      }
      .call-btn {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span>I'm lost! Please contact my owner.</span>
    </div>

    <div class="photo-box">
      <img src="tessie.jpg" alt="Tessie" />
    </div>

    <table>
      <tbody>
        <tr>
          <th scope="row">Name</th>
          <td>Tessie</td>
        </tr>
        <tr>
          <th scope="row">Contact Phone</th>
          <td><a href="tel:+420774898372">+420 774 898 372</a></td>
        </tr>
      </tbody>
    </table>

    <a class="call-btn" href="tel:+420774898372">Call Owner: +420 774 898 372</a>
  </main>
</body>
</html>
